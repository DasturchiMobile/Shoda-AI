# Root domains serve the public landing page.
# The authenticated app is still available at /login and /register on both shoda.app and ai.shoda.app.
# Admin/superadmin domains continue to serve the dashboard app.

upstream shoda_backend { server 127.0.0.1:8000; }
upstream shoda_frontend { server 127.0.0.1:8080; }

server {
    listen 80;
    server_name shoda.app www.shoda.app ai.shoda.app www.ai.shoda.app;
    root /var/www/shoda-landing;
    index index.html;

    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://shoda_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /login {
        proxy_pass http://shoda_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /register {
        proxy_pass http://shoda_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name admin.shoda.app superadmin.shoda.app;

    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://shoda_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://shoda_frontend;
        proxy_set_header Host $host;
    }
}
