# Production compose — serverda BOSHQA loyihalar ham ishlayotganini hisobga olgan holda.
#
# Qoidalar:
#   • 80/443/81 — Nginx Proxy Manager'niki, 8000 — Portainer'niki. Ularga TEGILMAYDI.
#   • Tashqariga faqat ikkita port chiqadi: ilova (APP_PORT) va landing (LANDING_PORT).
#     Ikkalasi ham .env orqali o'zgartiriladi — port band bo'lsa boshqasini yozing.
#   • postgres va backend host portiga umuman chiqmaydi (faqat ichki tarmoq).
#   • `name:` qo'yilgan — volume/network nomlari boshqa loyihalarnikiga aralashmaydi.
#   • Portlar 0.0.0.0'ga bog'langan, chunki Nginx Proxy Manager konteyneri ularga
#     server IP/docker-gateway orqali murojaat qiladi. Tashqi kirishni yopmoqchi
#     bo'lsangiz, UFW'da faqat 80/443 ni ochiq qoldiring.

name: shoda-ai

services:
  postgres:
    image: postgres:15
    container_name: shoda-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shoda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shoda}
      POSTGRES_DB: ${POSTGRES_DB:-shoda}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shoda} -d ${POSTGRES_DB:-shoda}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: shoda-backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - files:/var/shoda/files
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: shoda-frontend
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-8080}:80"
    restart: unless-stopped

  landing:
    image: nginx:alpine
    container_name: shoda-landing
    depends_on:
      - backend
    volumes:
      - ./landing:/usr/share/nginx/html:ro
      - ./infra/landing-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${LANDING_PORT:-8081}:80"
    restart: unless-stopped

volumes:
  pgdata:
  files:
